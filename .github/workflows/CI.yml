name: CI

on:
  push:
    branches:
      - main
      - cicd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: python -m unittest discover -s tests -p "smoke_test.py" -v

      - name: Run unit test
        run: python -m unittest discover -s tests -p "unit_test.py" -v

      - name: Run integration test
        run: python -m unittest discover -s tests -p "integration_test.py" -v

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t eviegeraghty10/weather-ml-app:${{ github.sha }} \
            -t eviegeraghty10/weather-ml-app:latest .

      - name: Run Docker container
        run: docker run -d --name weather-test eviegeraghty10/weather-ml-app:${{ github.sha }}

      - name: Execute command inside container
        run: docker exec weather-test python --version

      - name: Clean up container
        if: always()
        run: docker rm -f weather-test || true

      - name: Push Docker image with commit tag
        run: docker push eviegeraghty10/weather-ml-app:${{ github.sha }}

      - name: Push Docker image with latest tag
        run: docker push eviegeraghty10/weather-ml-app:latest
