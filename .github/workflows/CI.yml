name: CI

on:
  push:
    branches:
      - main
      - cicd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: python -m unittest discover -s tests -p "smoke_test.py" -v

      - name: Run unit test
        run: python -m unittest discover -s tests -p "unit_test.py" -v

      - name: Run integration test
        run: python -m unittest discover -s tests -p "integration_test.py" -v

      - name: Build Docker image
        run: docker build -t weather-ml-app:${{ github.sha }} .
