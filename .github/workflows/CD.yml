name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - cicd

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Check Kubernetes cluster
        run: kubectl get nodes

      - name: Deploy new Docker image
        run: |
          kubectl set image deployment/weather-ml-app \
            weather-ml-app=eviegeraghty10/weather-ml-app:${{ github.event.workflow_run.head_sha }}

      - name: Wait for rolling deployment
        run: |
          kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Check deployed pods
        run: |
          kubectl get pods
          kubectl get deployment weather-ml-app

      - name: Confirm deployment
        run: echo "Deployment completed successfully!"
