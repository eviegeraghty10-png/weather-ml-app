---
# Task 3(d): Create a NodePort Service for the app, then forward the server's
# public port 5000 to it so the app opens at http://<public-ip>:5000.
#
# Why the forwarder: with the Docker driver, the Minikube node lives on a
# private Docker network (e.g. 192.168.49.2) that the internet can't reach.
# socat listens on 0.0.0.0:5000 and passes traffic to the NodePort. Because it
# targets the Service (not one pod), it keeps working during rolling updates.
- name: "Task 3(d) - Create a Service for the application"
  hosts: production
  become: false
  vars_files:
    - vars.yml
  tasks:
    - name: Apply the Service manifest
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/service.yaml
      register: svc_apply
      changed_when: "'unchanged' not in svc_apply.stdout"

    - name: Get the Minikube IP
      ansible.builtin.command: minikube ip
      register: minikube_ip
      changed_when: false

    - name: Check the app answers on the NodePort
      ansible.builtin.uri:
        url: "http://{{ minikube_ip.stdout }}:{{ node_port }}/"
        status_code: 200
      register: nodeport_check
      retries: 10
      delay: 6
      until: nodeport_check.status == 200

    - name: Install socat
      become: true
      ansible.builtin.apt:
        name: socat
        state: present
        update_cache: true

    - name: Create a systemd service that forwards port {{ public_port }} to the NodePort
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/weather-app-forward.service
        mode: "0644"
        content: |
          [Unit]
          Description=Forward public port {{ public_port }} to the weather-ml-app NodePort in Minikube
          After=network-online.target docker.service

          [Service]
          ExecStart=/usr/bin/socat TCP-LISTEN:{{ public_port }},fork,reuseaddr TCP:{{ minikube_ip.stdout }}:{{ node_port }}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      register: forward_unit

    - name: Enable and start the port forwarder
      become: true
      ansible.builtin.systemd:
        name: weather-app-forward
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if forward_unit.changed else 'started' }}"

    - name: Check the app answers on public port {{ public_port }}
      ansible.builtin.uri:
        url: "http://localhost:{{ public_port }}/"
        status_code: 200
      register: public_check
      retries: 5
      delay: 3
      until: public_check.status == 200

    - name: Get the Service
      ansible.builtin.command: kubectl get service {{ service_name }} -o wide
      register: svc_info
      changed_when: false

    - name: Show the Service and how to reach the app
      ansible.builtin.debug:
        msg: "{{ svc_info.stdout_lines + ['',
          'Inside the server: curl $(minikube ip):' ~ node_port,
          'From a browser:    http://<production-server-public-ip>:' ~ public_port] }}"
