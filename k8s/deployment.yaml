# Kubernetes Deployment for the Weather ML Flask app.
# Applied by ansible/03_deploy_app.yml (Task 3c) and reused by CD.yml (Task 4g).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
  labels:
    app: weather-ml-app
spec:
  # 3 copies of the app, so one can be replaced while the others keep serving (Task 3e)
  replicas: 3
  revisionHistoryLimit: 5          # keep old versions so "kubectl rollout undo" works
  minReadySeconds: 5               # a new pod must stay healthy 5s before it counts as available
  selector:
    matchLabels:
      app: weather-ml-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below 3 working pods during an update
      maxSurge: 1                  # start 1 new pod at a time, then remove 1 old pod
  template:
    metadata:
      labels:
        app: weather-ml-app        # the Service finds pods by this label
    spec:
      containers:
        - name: weather-ml-app
          # CHANGE THIS to your team's DockerHub image (same one Person 1 pushed)
          image: cnoel1/weather-ml-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000  # Flask listens on 5000 (see app.py and Dockerfile)
          # Kubernetes only sends traffic to a pod once "/" answers with HTTP 200
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          # restart the container if it stops answering
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
